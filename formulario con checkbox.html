<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

<!-- Conecta la página web con una librería en internet que contiene un paquete de iconos para poder utilizarlos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<!-- agrega el color de fondo -->
<body bgcolor="#f5eeef">

<h2 align="center">
  <font face="Century Gothic" color="#6c3483" size="5">Formularios con checkbox</font>
</h2>

<!-- Contenedor que agrupa los campos para recopilar y enviar datos -->
<form action="" method="post" align="center">

  <font face="Century Gothic" size="3" color="#4a235a">Ingresa tu nombre:</font>
  <br>

  <!-- Casilla de texto para escribir información -->
  <input type="text" name="nombre" size="25">
  <br><br>

  <font face="Century Gothic" size="3" color="#4a235a">Selecciona los lenguajes que conozcas:</font>
  <br><br>

  <!-- Casillas de selección múltiple que permiten marcar una o varias opciones al mismo tiempo -->
  <input type="checkbox" name="Java"> <font face="Century Gothic" size="3" color="#4a235a">Java</font> <br>
  <input type="checkbox" name="Python"> <font face="Century Gothic" size="3" color="#4a235a">Python</font> <br>
  <input type="checkbox" name="C#"> <font face="Century Gothic" size="3" color="#4a235a">C#</font> <br>
  <input type="checkbox" name="Flutter"> <font face="Century Gothic" size="3" color="#4a235a">Flutter</font> <br>

</form>

</body>
</html>
