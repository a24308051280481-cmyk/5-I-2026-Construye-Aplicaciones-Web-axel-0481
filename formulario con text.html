<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

<!-- Conecta la página web con una librería en internet que contiene un paquete de iconos para poder utilizarlos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body bgcolor="#fdf2e9">

<h2 align="center">
  <font face="Comic Sans MS" color="#a04000" size="5">Formulario con text area</font>
</h2>

<!-- Contenedor que agrupa los campos para recopilar y enviar datos -->
<form action="" method="post" align="center">

  <font face="Comic Sans MS" size="3" color="#6e2c00">Ingresa tu nombre:</font>
  <br>

  <!-- Casilla de texto para escribir información -->
  <input type="text" name="nombre" size="25">
  <br><br>

  <font face="Comic Sans MS" size="3" color="#6e2c00">Ingresa tu correo:</font>
  <br>

  <!-- Campo para ingresar un correo electrónico que valida automáticamente el formato -->
  <input type="email" name="correo" size="25">
  <br><br>

  <font face="Comic Sans MS" size="3" color="#6e2c00">Ingresa tus comentarios:</font>
  <br>

  <!-- Área de texto de varias líneas para escribir mensajes o textos más largos -->
  <textarea name="comentarios" rows="4" cols="30"></textarea>
  <br><br>

  <!-- Botón para enviar la información recopilada -->
  <input type="submit" value="Enviar">

  <!-- Botón para limpiar o borrar todos los datos del formulario -->
  <input type="reset" value="Borrar">

</form>

</body>
</html>
