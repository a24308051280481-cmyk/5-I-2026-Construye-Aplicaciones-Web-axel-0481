<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

<!-- Conecta la página web con una librería en internet que contiene un paquete de iconos para poder utilizarlos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body bgcolor="#fef3e7">

<h2 align="center">
  <font face="Segoe UI" color="#7e5109" size="5">Formularios con selección</font>
</h2>

<!-- Contenedor que agrupa los campos para recopilar y enviar datos -->
<form action="" method="post" align="center">

  <font face="Segoe UI" size="3" color="#3e2723">Ingresa tu nombre:</font>
  <br>

  <!-- Casilla de texto para escribir información -->
  <input type="text" name="nombre" size="25">
  <br><br>

  <font face="Segoe UI" size="3" color="#3e2723">Selecciona tu país:</font>
  <br>

  <!-- Lista desplegable que permite elegir una opción entre varias disponibles -->
  <select name="pais">
    <!-- Representa cada opción individual que el usuario puede elegir dentro de la lista -->
    <option value="1">Argentina</option>
    <option value="2">España</option>
    <option value="3">México</option>
    <option value="4">Guatemala</option>
    <option value="5">Honduras</option>
    <option value="6">El Salvador</option>
    <option value="7">Venezuela</option>
    <option value="8">Colombia</option>
  </select>
  <br><br>

  <!-- Botón para enviar la información recopilada -->
  <input type="submit" value="Enviar">

  <!-- Botón para limpiar o borrar todos los datos del formulario -->
  <input type="reset" value="Borrar">

</form>

</body>
</html>
