<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

<!-- Conecta la página web con una librería en internet que contiene un paquete de iconos para poder utilizarlos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body bgcolor="#f4ecf7">

<h2 align="center">
  <font face="Verdana" color="#5b2c6f" size="5">Formulario para contraseñas</font>
</h2>

<!-- Contenedor que agrupa los campos para recopilar y enviar datos -->
<form action="" method="post" align="center">

  <font face="Verdana" size="3" color="#2c3e50">Ingresa tu usuario:</font>
  <br>

  <!-- Casilla de texto para que el usuario escriba su nombre de usuario -->
  <input type="text" name="usuario" size="25">
  <br><br>

  <font face="Verdana" size="3" color="#2c3e50">Ingresa tu contraseña:</font>
  <br>

  <!-- Casilla de contraseña que oculta los caracteres tipeados por seguridad -->
  <input type="password" name="pass" size="25">
  <br><br>

  <!-- Botón para enviar la información recopilada -->
  <input type="submit" value="Enviar">

  <!-- Botón para limpiar o borrar todos los datos del formulario -->
  <input type="reset" value="Borrar">

</form>

</body>
</html>
