<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

<!-- Conecta la página web con una librería en internet que contiene un paquete de iconos para poder utilizarlos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body bgcolor="#eafaf1">

<h2 align="center">
  <font face="Palatino Linotype" color="#1e8449" size="5">Formularios con Radiobotón</font>
</h2>

<!-- Contenedor que agrupa los campos para recopilar y enviar datos -->
<form action="" method="post" align="center">

  <font face="Palatino Linotype" size="3" color="#145a32">Ingresa tu nombre:</font>
  <br>

  <!-- Casilla de texto para escribir información -->
  <input type="text" name="nombre" size="25">
  <br><br>

  <font face="Palatino Linotype" size="3" color="#145a32">Selecciona el máximo de estudios que tienes:</font>
  <br><br>

  <!-- Botones de opción única que permiten seleccionar solo una alternativa del grupo -->
  <input type="radio" name="estudios" value="1"> <font face="Palatino Linotype" size="3" color="#145a32">Sin estudios</font> <br>
  <input type="radio" name="estudios" value="2"> <font face="Palatino Linotype" size="3" color="#145a32">Primaria</font> <br>
  <input type="radio" name="estudios" value="3"> <font face="Palatino Linotype" size="3" color="#145a32">Secundaria</font> <br>
  <input type="radio" name="estudios" value="4"> <font face="Palatino Linotype" size="3" color="#145a32">Preparatoria</font> <br>
  <br>

  <!-- Botón para enviar la información recopilada -->
  <input type="submit" value="Enviar">

  <!-- Botón para limpiar o borrar todos los datos del formulario -->
  <input type="reset" value="Borrar">

</form>

</body>
</html>
