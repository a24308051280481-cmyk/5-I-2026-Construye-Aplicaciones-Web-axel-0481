<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

<!-- Conecta la página web con una librería en internet que contiene un paquete de iconos para poder utilizarlos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body bgcolor="#eaf2f8">

<h2 align="center">
  <font face="Lucida Sans" color="#1a5276" size="5">Formulario con limitaciones</font>
</h2>

<!-- Contenedor que agrupa los campos para recopilar y enviar datos -->
<form action="" method="post" align="center">

  <font face="Lucida Sans" size="3" color="#212f3d">Ingresa tu nombre:</font>
  <br>

  <!-- Casilla de texto desactivada (disabled) que impide que el usuario escriba o haga clic en ella -->
  <input type="text" name="nombre" size="25" disabled>
  <br><br>

  <font face="Lucida Sans" size="3" color="#212f3d">Contraseña:</font>
  <br>

  <!-- Casilla de contraseña con un máximo permitido de 5 caracteres (maxlength="5") -->
  <input type="password" name="pass" size="25" maxlength="5">
  <br><br>

  <font face="Lucida Sans" size="3" color="#212f3d">Comentarios:</font>
  <br>

  <!-- Cuadro de texto multilínea (textarea) configurado solo para lectura (readonly) para evitar modificaciones -->
  <textarea name="comentarios" rows="4" cols="30" readonly>Este es mi comentario y no se puede borrar</textarea>

</form>

</body>
</html>
