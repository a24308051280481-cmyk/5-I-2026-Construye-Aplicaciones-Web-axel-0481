<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

<!-- Conecta la página web con una librería en internet que contiene un paquete de iconos para poder utilizarlos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body bgcolor="#e8f8f5">

<h2 align="center">
  <font face="Georgia" color="#117a65" size="5">Formularios con agrupamiento</font>
</h2>

<!-- Contenedor que agrupa los campos para recopilar y enviar datos -->
<form action="" method="post" align="center">

  <!-- Crea un recuadro para agrupar campos relacionados entre sí -->
  <fieldset>
    <!-- Pone un título al recuadro de agrupamiento -->
    <legend><font face="Georgia" color="#117a65"><b>Datos personales</b></font></legend>
    
    <font face="Georgia" size="3" color="#1c2833">Nombre y apellido:</font>
    <!-- Casilla de texto para escribir información -->
    <input type="text" name="nombre_apellido" size="25"><br><br>

    <font face="Georgia" size="3" color="#1c2833">Documento válido:</font>
    <!-- Botón que permite seleccionar y subir un archivo desde el dispositivo -->
    <input type="file" name="documento"><br><br>

    <font face="Georgia" size="3" color="#1c2833">Fecha de nacimiento:</font>
    <!-- Muestra un calendario para elegir una fecha -->
    <input type="date" name="fecha_nacimiento">
  </fieldset>

  <br>

  <!-- Segundo recuadro para agrupar otro grupo de datos -->
  <fieldset>
    <legend><font face="Georgia" color="#117a65"><b>Datos de estudio</b></font></legend>

    <font face="Georgia" size="3" color="#1c2833">Nombre de la escuela:</font>
    <input type="text" name="escuela" size="25"><br><br>

    <font face="Georgia" size="3" color="#1c2833">Certificado válido:</font>
    <input type="file" name="certificado"><br><br>

    <font face="Georgia" size="3" color="#1c2833">Fecha de egreso:</font>
    <input type="date" name="fecha_egreso">
  </fieldset>

  <br>

  <!-- Botón para enviar el formulario -->
  <button type="submit">
    Enviar 
    <!-- Muestra un icono gráfico de la librería externa -->
    <i class="fa-regular fa-paper-plane"></i>
  </button>

  <!-- Botón para limpiar los campos del formulario -->
  <button type="reset">
    Borrar 
    <i class="fa fa-trash"></i>
  </button>

</form>

</body>
</html>
